# ArgoCD Application（GitOps 拉取本清单；镜像 tag 由 argocd-apps 仓库 bump 触发金丝雀）
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shizurak-web
  namespace: argocd
spec:
  project: core-ui
  source:
    repoURL: git@gitlab.xrak.top:core-ui/shizurak.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: core-ui
  syncPolicy:
    automated: { prune: true, selfHeal: true }
